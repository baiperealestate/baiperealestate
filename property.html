<!-- ================= PROPERTY CONTENT ================= -->
<section class="property-container">

  <!-- LEFT -->
  <div class="property-main">

    <div class="property-gallery">
      <button class="slider-btn prev" type="button" aria-label="Vorige afbeelding">‹</button>
      <img id="propertyImage" src="" alt="Afbeelding van de woning">
      <button class="slider-btn next" type="button" aria-label="Volgende afbeelding">›</button>
    </div>

    <div class="property-summary">

      <h1 id="title"></h1>
      <p class="price" id="price"></p>
      <p class="location" id="location"></p>

      <ul class="property-meta">
        <li><strong>Slaapkamers</strong><span id="bedrooms"></span></li>
        <li><strong>Badkamers</strong><span id="bathrooms"></span></li>
        <li><strong>Perceelgrootte</strong><span id="size"></span></li>
      </ul>

    </div>

    <section class="property-description">
      <h2>Woningbeschrijving</h2>
      <p id="description"></p>
    </section>

    <section class="property-features">
      <h2>Woningkenmerken</h2>
      <ul id="features" class="features-list"></ul>
    </section>

  </div>


  <!-- RIGHT -->
  <aside class="property-sidebar">

    <div class="contact-card">

      <h3>Informatie aanvragen</h3>

      <form action="https://formspree.io/f/xzdpvjnk"
            method="POST"
            class="contact-form">

        <!-- Email subject -->
        <input type="hidden"
               name="_subject"
               value="Nieuwe woningaanvraag | Bai Pe Real Estate">

        <!-- Property information -->
        <input type="hidden"
               name="property"
               id="propertyField">

        <input type="hidden"
               name="property_url"
               id="propertyUrl">

        <!-- Contact information -->
        <input type="text"
               name="name"
               placeholder="Volledige naam"
               autocomplete="name"
               required>

        <input type="email"
               name="email"
               placeholder="E-mailadres"
               autocomplete="email"
               required>

        <input type="tel"
               name="phone"
               placeholder="Telefoonnummer / WhatsApp"
               autocomplete="tel">

        <!-- Buyer location (Required) -->
        <label for="buyer_location">
          Waar woont u momenteel? *
        </label>

        <select name="buyer_location"
                id="buyer_location"
                required>

          <option value="" selected disabled>
            Selecteer uw huidige woonplaats
          </option>

          <option value="Momenteel woonachtig op Curaçao">
            Ik woon momenteel op Curaçao
          </option>

          <option value="Momenteel woonachtig in het buitenland">
            Ik woon momenteel in het buitenland
          </option>

          <option value="Van plan om naar Curaçao te verhuizen">
            Ik ben van plan naar Curaçao te verhuizen
          </option>

        </select>

        <!-- Financing position (Required) -->
        <label for="financing_position">
          Wat is uw huidige financieringssituatie? *
        </label>

        <select name="financing_position"
                id="financing_position"
                required>

          <option value="" selected disabled>
            Selecteer uw financieringssituatie
          </option>

          <option value="Koper met eigen middelen">
            Ik koop met eigen middelen
          </option>

          <option value="Hypotheek vooraf goedgekeurd">
            Mijn hypotheek is vooraf goedgekeurd
          </option>

          <option value="Van plan een hypotheek aan te vragen">
            Ik ben van plan een hypotheek aan te vragen
          </option>

          <option value="Oriënteert zich op financieringsmogelijkheden">
            Ik oriënteer mij nog op financieringsmogelijkheden
          </option>

          <option value="Wenst begeleiding bij financiering">
            Ik ontvang graag begeleiding bij de financiering
          </option>

        </select>

        <!-- Additional message -->
        <textarea name="message"
                  placeholder="Ik heb interesse in deze woning. Neem gerust contact met mij op."
                  rows="4"></textarea>

        <!-- Submit -->
        <button type="submit" class="btn">
          Neem contact op met Bai Pe Real Estate
        </button>

      </form>

    </div>

  </aside>

</section>
